<!doctype html>
<html data-direction="ghat">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>Kashi Shakti - Production Ready Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════ Kashi Shakti — Base Styles ═══════ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14px;
  line-height: 1.5;
  transition: background 0.3s, color 0.3s;
}

/* Type system */
.serif       { font-family: 'Fraunces', 'Cormorant Garamond', Georgia, serif; font-optical-sizing: auto; }
.display     { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.02em; font-variation-settings: "SOFT" 50, "WONK" 0; }
.devanagari  { font-family: 'Noto Serif Devanagari', serif; }
.mono        { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* Tokens */
:root {
  --bg: #F6EFE3; --bg-alt: #FDF8EE; --surface: #FFFFFF;
  --ink: #1E1410; --ink-mid: #4A3A2E; --ink-muted: #8B7461; --ink-faint: #B9A996;
  --border: #E6D6BE; --border-soft: #F0E4CF;
  --accent: #B23A1A; --accent-soft: #F0D9CC;
  --maroon: #7A1F1A; --gold: #A07510; --gold-bright: #C89A2B;
  --green: #436B2A; --red: #B32021; --blue: #2A4878;
  --success: #E6EFD8; --warning: #FCEBD5; --danger: #F7DCDC; --info: #E0E8F2;
  --shadow-sm: 0 1px 3px rgba(60,30,10,0.06);
  --shadow-md: 0 4px 16px rgba(60,30,10,0.08);
  --shadow-lg: 0 12px 40px rgba(60,30,10,0.12);
  --hero-grad: linear-gradient(135deg, #F6E8CD 0%, #EDD2AE 55%, #E0B27E 100%);
  --nav-bg: rgba(255,255,255,0.9); --nav-ink: #1E1410; --logo-ink: #7A1F1A;
}

/* App shell */
.app { min-height: 100vh; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }

/* Top nav */
.nav { height: 72px; background: var(--nav-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 40px; gap: 32px; flex-shrink: 0; position: fixed; width: 100%; top: 0; z-index: 100; backdrop-filter: blur(12px); transition: all 0.3s;}
.nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--logo-ink); cursor: pointer; letter-spacing: -0.02em;}
.nav-logo-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--surface); display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif Devanagari', serif; font-size: 20px; font-weight: 400; line-height: 1; padding-bottom: 2px;}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-family: inherit; transition: all 0.2s; white-space: nowrap; }
.btn-primary { background: var(--accent); color: #FFF; border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: var(--shadow-md);}
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--ink); background: rgba(0,0,0,0.02); }
.btn-sm { padding: 8px 16px; font-size: 13px; }
.btn-link { background: transparent; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 0; transition: color 0.2s;}
.btn-link:hover { color: var(--maroon); text-decoration: underline; }

/* Cards & Utilities */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.card-hover:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 11px; font-weight: 600; border-radius: 20px; background: var(--border-soft); color: var(--ink-mid); border: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em;}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

/* Image classes */
.bg-image-cover { background-size: cover; background-position: center; background-repeat: no-repeat; }
.section-bg-pattern { position: relative; }
.section-bg-pattern::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 0l1.5 28.5L60 30l-28.5 1.5L30 60l-1.5-28.5L0 30l28.5-1.5z" fill="%23B23A1A" fill-opacity="0.03"/></svg>');
    z-index: 0; pointer-events: none;
}
.content-relative { position: relative; z-index: 1; }

.page-enter { animation: pageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Scrollbars */
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-muted); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
// ══════ Shared Components ═══════

function Logo() {
  return (
    <div className="nav-logo">
      <div className="nav-logo-mark">ॐ</div>
      <div>Kashi <span style={{ fontWeight: 400 }}>Shakti</span></div>
    </div>
  );
}

function SectionHeader({ title, sub, action, align = 'left', color = 'var(--ink)' }) {
  return (
    <div className="content-relative" style={{ display: 'flex', flexDirection: align === 'center' ? 'column' : 'row', alignItems: align === 'center' ? 'center' : 'flex-end', justifyContent: align === 'center' ? 'center' : 'space-between', marginBottom: 32, textAlign: align }}>
      <div>
        <h2 className="display" style={{ fontSize: 36, color: color, lineHeight: 1.1 }}>{title}</h2>
        {sub && <div style={{ fontSize: 16, color: 'var(--ink-muted)', marginTop: 12, maxWidth: 600, margin: align === 'center' ? '12px auto 0' : '12px 0 0' }}>{sub}</div>}
      </div>
      {action && <div style={{ marginTop: align === 'center' ? 24 : 0 }}>{action}</div>}
    </div>
  );
}

// ══════ Home Page Component ═══════
function HomePage({ setPage }) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const i = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(i);
  }, []);
  const d = 3, h = 14, m = 22, s = 59 - new Date(now).getSeconds();

  return (
    <div className="page-enter" style={{ paddingBottom: 0 }}>
      
      {/* 1. Impactful Full-Screen Hero Section */}
      <div style={{ 
          position: 'relative', 
          minHeight: '95vh', /* Near full screen */
          display: 'flex',
          flexDirection: 'column',
          justifyContent: 'center',
          background: 'linear-gradient(to bottom, rgba(30, 20, 16, 0.4), rgba(30, 20, 16, 0.85)), url("https://images.unsplash.com/photo-1596423735880-5fec800a5528?ixlib=rb-4.0.3&auto=format&fit=crop&w=2500&q=80") center/cover no-repeat', 
          backgroundAttachment: 'fixed',
          color: '#fff', 
          padding: '140px 40px 180px', 
          textAlign: 'center',
          marginTop: '72px' /* offset nav */
      }}>
        <div style={{ maxWidth: 900, margin: '0 auto', position: 'relative', zIndex: 2 }}>
            <div className="eyebrow" style={{ color: 'var(--gold-bright)', marginBottom: 16, letterSpacing: '0.2em', fontSize: 12 }}>Your Gateway to Sanatan Dharma</div>
            <h1 className="display" style={{ fontSize: 72, lineHeight: 1.05, marginBottom: 24, textShadow: '0 4px 20px rgba(0,0,0,0.6)' }}>
                One Platform For All Your Spiritual Needs
            </h1>
            <p style={{ fontSize: 20, opacity: 0.95, marginBottom: 40, textShadow: '0 2px 10px rgba(0,0,0,0.6)', fontWeight: 400, lineHeight: 1.6 }}>
                Discover authentic Vrat Kathas, track precise Panchang timings, learn proper Puja Vidhis, and explore the divine temples of Kashi.
            </p>
            <div style={{ display: 'flex', gap: 20, justifyContent: 'center' }}>
                <button className="btn btn-primary" style={{ padding: '16px 32px', fontSize: 16, borderRadius: 12 }}>Explore Platform →</button>
                <button className="btn btn-ghost" style={{ color: '#fff', borderColor: 'rgba(255,255,255,0.5)', padding: '16px 32px', fontSize: 16, borderRadius: 12, backdropFilter: 'blur(4px)' }}>Read Vrat Kathas</button>
            </div>
        </div>
      </div>

      {/* Floating Trackers (Nearest Sacred Day + Countdown) overlapping the hero */}
      <div className="container" style={{ marginTop: '-100px', position: 'relative', zIndex: 10, marginBottom: 60 }}>
         <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 24 }}>
            {/* Next Sacred Fast */}
            <div className="card" style={{ padding: 32, display: 'flex', alignItems: 'center', justifyContent: 'space-between', boxShadow: 'var(--shadow-lg)', background: 'var(--surface)' }}>
               <div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
                      <span className="chip chip-accent">Next Sacred Fast</span>
                      <span style={{ fontSize: 13, color: 'var(--ink-mid)', fontWeight: 600 }}>26 April 2026</span>
                  </div>
                  <h2 className="display" style={{ fontSize: 32, color: 'var(--ink)' }}>Varuthini Ekadashi</h2>
                  <div style={{ fontSize: 14, color: 'var(--ink-muted)', marginTop: 8 }}>Observe the fast, read the Katha & track Parana timings.</div>
               </div>
               <button className="btn btn-primary" onClick={() => setPage('ekadashi-detail')}>View Timings →</button>
            </div>
            
            {/* Festival Countdown */}
            <div className="card" style={{ padding: '24px 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', boxShadow: 'var(--shadow-lg)', background: 'var(--bg-alt)' }}>
               <div>
                  <div className="eyebrow" style={{ marginBottom: 8, color: 'var(--maroon)' }}>Major Festival Upcoming</div>
                  <h2 className="serif" style={{ fontSize: 24, color: 'var(--ink)', fontWeight: 600 }}>Ram Navami</h2>
               </div>
               <div style={{ display: 'flex', gap: 12, textAlign: 'center' }}>
                  {[[d,'Days'],[h,'Hours'],[m,'Mins'],[s,'Secs']].map(([val, lbl], i) => (
                    <div key={i} style={{ background: 'var(--surface)', padding: '12px 16px', borderRadius: 12, border: '1px solid var(--border-soft)', boxShadow: 'var(--shadow-sm)' }}>
                      <div className="display" style={{ fontSize: 28, color: 'var(--maroon)', lineHeight: 1 }}>{String(val).padStart(2,'0')}</div>
                      <div style={{ fontSize: 10, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '0.1em', marginTop: 6, fontWeight: 700 }}>{lbl}</div>
                    </div>
                  ))}
               </div>
            </div>
         </div>
      </div>

      {/* 2. Authenticity Section */}
      <div className="section-bg-pattern" style={{ padding: '40px 0 80px', borderBottom: '1px solid var(--border-soft)' }}>
         <div className="container content-relative">
             <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 48, textAlign: 'center' }}>
                 <div>
                     <img src="https://img.icons8.com/ios/100/b23a1a/om.png" style={{ width: 64, height: 64, marginBottom: 20 }} alt="Om Icon"/>
                     <h3 className="serif" style={{ fontSize: 20, fontWeight: 600, color: 'var(--ink)', marginBottom: 12 }}>Authentic Shastric Knowledge</h3>
                     <p style={{ fontSize: 15, color: 'var(--ink-mid)', lineHeight: 1.6 }}>100% accurate Panchang, Vrat Kathas, and Puja Vidhis rooted in ancient Vedic texts.</p>
                 </div>
                 <div>
                     <img src="https://img.icons8.com/ios/100/b23a1a/hindu-temple.png" style={{ width: 64, height: 64, marginBottom: 20 }} alt="Temple Icon"/>
                     <h3 className="serif" style={{ fontSize: 20, fontWeight: 600, color: 'var(--ink)', marginBottom: 12 }}>Detailed Temple Guides</h3>
                     <p style={{ fontSize: 15, color: 'var(--ink-mid)', lineHeight: 1.6 }}>Deep historical and spiritual insights into Kashi's sacred ghats, shrines, and corridors.</p>
                 </div>
                 <div>
                     <img src="https://img.icons8.com/ios/100/b23a1a/praying-man.png" style={{ width: 64, height: 64, marginBottom: 20 }} alt="Ritual Icon"/>
                     <h3 className="serif" style={{ fontSize: 20, fontWeight: 600, color: 'var(--ink)', marginBottom: 12 }}>Comprehensive Rituals</h3>
                     <p style={{ fontSize: 15, color: 'var(--ink-mid)', lineHeight: 1.6 }}>Your definitive platform for learning daily Aarti, Chadhava, and spiritual worship processes.</p>
                 </div>
             </div>
         </div>
      </div>

      {/* 3. Tithi Trackers (Ekadashi, Purnima, Amavasya, Pradosh) */}
      <div className="container content-relative" style={{ padding: '80px 40px 0' }}>
         <SectionHeader title="Sacred Lunar Days" sub="Track all upcoming observances based on your city's Panchang." />
         <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 20 }}>
            {[
              { type: 'Vrat', name: 'Pradosh Vrat', date: '03 May 2026', img: 'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?w=400&q=80' },
              { type: 'Ekadashi', name: 'Varuthini', date: '26 Apr 2026', highlight: true, action: () => setPage('ekadashi-detail'), img: 'https://images.unsplash.com/photo-1561361513-2d000a50f0dc?w=400&q=80' },
              { type: 'Purnima', name: 'Chaitra Purnima', date: '15 Apr 2026', img: 'https://images.unsplash.com/photo-1514222026211-13c5ec8233ed?w=400&q=80' },
              { type: 'Amavasya', name: 'Chaitra Amavasya', date: '27 Apr 2026', img: 'https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?w=400&q=80' },
              { type: 'Pradosh', name: 'Shukla Pradosh', date: '03 May 2026', img: 'https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?w=400&q=80' },
            ].map((t, idx) => (
              <div key={idx} onClick={t.action} className="card card-hover" style={{ cursor: t.action ? 'pointer' : 'default', borderTop: t.highlight ? '4px solid var(--accent)' : '1px solid var(--border)' }}>
                 <div className="bg-image-cover" style={{ height: 100, backgroundImage: `url(${t.img})` }}></div>
                 <div style={{ padding: '16px 20px' }}>
                     <div className="eyebrow" style={{ marginBottom: 6, color: t.highlight ? 'var(--accent)' : 'var(--ink-muted)' }}>Nearest {t.type}</div>
                     <div className="serif" style={{ fontSize: 18, fontWeight: 600, color: 'var(--ink)' }}>{t.name}</div>
                     <div style={{ fontSize: 13, color: 'var(--ink-mid)', marginTop: 6, fontWeight: 500 }}>{t.date}</div>
                 </div>
              </div>
            ))}
         </div>
      </div>

      {/* 4. Explore Temples (Immersive & Modern Layout) */}
      <div style={{ background: 'var(--ink)', color: 'var(--surface)', marginTop: 100, padding: '100px 0' }}>
        <div className="container">
           <SectionHeader align="center" title="Explore Divine Temples" sub="Journey through the sacred corridors of India." color="var(--surface)" action={<button className="btn btn-ghost" style={{borderColor: 'rgba(255,255,255,0.3)', color: '#fff'}}>View All Temples →</button>} />
           
           <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr', gridTemplateRows: 'repeat(2, 240px)', gap: 24, marginTop: 48 }}>
              {/* Feature Large Card */}
              <div className="card card-hover" style={{ gridRow: 'span 2', position: 'relative', background: 'linear-gradient(to top, rgba(0,0,0,0.9), transparent), url("https://images.unsplash.com/photo-1561361513-2d000a50f0dc?auto=format&fit=crop&w=800&q=80") center/cover', border: 'none', cursor: 'pointer' }}>
                 <div style={{ position: 'absolute', bottom: 32, left: 32, right: 32 }}>
                    <span className="chip" style={{ background: 'var(--accent)', color: '#fff', border: 'none', marginBottom: 16 }}>Kashi Darshan</span>
                    <h3 className="display" style={{ fontSize: 40, color: '#fff', marginBottom: 12, lineHeight: 1.1 }}>Kashi Vishwanath Corridor</h3>
                    <p style={{ color: 'rgba(255,255,255,0.8)', fontSize: 15, lineHeight: 1.6 }}>The spiritual heart of India, where millions seek blessings at the golden Jyotirlinga.</p>
                 </div>
              </div>
              
              {/* Grid Items */}
              {[
                { name: 'Sankat Mochan', loc: 'Varanasi', img: 'https://images.unsplash.com/photo-1514222026211-13c5ec8233ed?auto=format&fit=crop&w=600&q=80' },
                { name: 'Mahakaleshwar', loc: 'Ujjain', img: 'https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?auto=format&fit=crop&w=600&q=80' },
                { name: 'Ram Mandir', loc: 'Ayodhya', img: 'https://images.unsplash.com/photo-1600078686884-6014d5e21fb2?auto=format&fit=crop&w=600&q=80' },
                { name: 'Dashashwamedh', loc: 'Varanasi Ghat', img: 'https://images.unsplash.com/photo-1596423735880-5fec800a5528?auto=format&fit=crop&w=600&q=80' }
              ].map((tmpl, idx) => (
                <div key={idx} className="card card-hover" style={{ position: 'relative', background: `linear-gradient(to top, rgba(0,0,0,0.8), transparent), url("${tmpl.img}") center/cover`, border: 'none', cursor: 'pointer' }}>
                   <div style={{ position: 'absolute', bottom: 20, left: 20 }}>
                      <div className="serif" style={{ fontSize: 22, fontWeight: 600, color: '#fff' }}>{tmpl.name}</div>
                      <div style={{ fontSize: 13, color: 'var(--gold-bright)', marginTop: 4, fontWeight: 500 }}>📍 {tmpl.loc}</div>
                   </div>
                </div>
              ))}
           </div>
        </div>
      </div>

      {/* 5. Custom UI: Hindu Festivals (Month-wise Timeline) */}
      <div className="container content-relative" style={{ padding: '80px 40px 0' }}>
         <SectionHeader title="Hindu Festivals Calendar" sub="Month-wise breakdown of prominent Sanatan festivals." />
         <div style={{ display: 'flex', overflowX: 'auto', gap: 20, paddingBottom: 24, scrollbarWidth: 'none' }}>
            {[
              { m: 'Chaitra', count: '5', active: true }, { m: 'Vaishakha', count: '3' }, 
              { m: 'Jyeshtha', count: '2' }, { m: 'Ashadha', count: '4' }, 
              { m: 'Shravana', count: '6' }, { m: 'Bhadrapada', count: '7' },
              { m: 'Ashvina', count: '4' }, { m: 'Kartika', count: '8' }
            ].map((month, idx) => (
               <div key={idx} style={{ 
                   minWidth: 140, textAlign: 'center', padding: '24px 16px', 
                   borderRadius: 100, border: month.active ? '2px solid var(--accent)' : '1px solid var(--border)',
                   background: month.active ? 'var(--accent-soft)' : 'var(--surface)', cursor: 'pointer', transition: 'all 0.2s' 
               }} onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-4px)'} onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}>
                   <h3 className="serif" style={{ fontSize: 18, color: month.active ? 'var(--accent)' : 'var(--ink)' }}>{month.m}</h3>
                   <p style={{ fontSize: 12, color: 'var(--ink-muted)', marginTop: 4 }}>{month.count} Festivals</p>
               </div>
            ))}
         </div>
      </div>

      {/* 6. Custom UI: Vrat Katha (Book/List Layout) & Puja Vidhi (Step Cards) */}
      <div className="container content-relative" style={{ padding: '80px 40px 0', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 48 }}>
         
         {/* Vrat Katha List */}
         <div>
            <SectionHeader title="Vrat Kathas" sub="Read the authentic stories behind the fasts." action={<button className="btn-link">View Library →</button>}/>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
               {[
                 { title: 'Shri Satyanarayan Katha', desc: 'Complete katha for full moon fasting.', img: 'https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?w=150&q=80' },
                 { title: 'Varuthini Ekadashi Katha', desc: 'The legendary tale of King Mandhata.', img: 'https://images.unsplash.com/photo-1561361513-2d000a50f0dc?w=150&q=80' },
                 { title: 'Somvati Amavasya Katha', desc: 'Significance of ancestral offerings.', img: 'https://images.unsplash.com/photo-1590050752117-238cb0fb12b1?w=150&q=80' }
               ].map((katha, idx) => (
                 <div key={idx} className="card card-hover" style={{ display: 'flex', padding: 16, alignItems: 'center', cursor: 'pointer' }}>
                    <div className="bg-image-cover" style={{ width: 80, height: 80, borderRadius: 8, backgroundImage: `url(${katha.img})` }}></div>
                    <div style={{ flex: 1, marginLeft: 20 }}>
                       <h4 className="serif" style={{ fontSize: 18, fontWeight: 600, color: 'var(--ink)', marginBottom: 4 }}>{katha.title}</h4>
                       <p style={{ fontSize: 13, color: 'var(--ink-mid)' }}>{katha.desc}</p>
                    </div>
                    <button className="btn btn-ghost btn-sm" style={{ borderRadius: 100 }}>Read 📖</button>
                 </div>
               ))}
            </div>
         </div>

         {/* Puja Vidhi Step Cards */}
         <div>
            <SectionHeader title="Puja Vidhi" sub="Step-by-step guides for home worship." action={<button className="btn-link">All Vidhis →</button>}/>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
               {[
