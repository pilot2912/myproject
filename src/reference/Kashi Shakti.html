<style>
/* ══════ Kashi Shakti — Base Styles ═══════ */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14px;
  line-height: 1.5;
  transition: background 0.3s, color 0.3s;
}

/* Type system */
.serif       { font-family: 'Fraunces', 'Cormorant Garamond', Georgia, serif; font-optical-sizing: auto; }
.display     { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.02em; font-variation-settings: "SOFT" 50, "WONK" 0; }
.devanagari  { font-family: 'Noto Serif Devanagari', serif; }
.mono        { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* App shell */
.app {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
}

/* Top nav */
.nav {
  height: 64px;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 28px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(12px);
}
[data-direction="aarti"] .nav { background: rgba(28,22,15,0.85); }
[data-direction="ghat"]  .nav { background: rgba(255,255,255,0.9); }

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 19px;
  color: var(--logo-ink);
  letter-spacing: -0.02em;
  cursor: pointer;
}
.nav-logo-mark {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif Devanagari', serif;
  font-size: 17px;
  font-weight: 400;
  line-height: 1;
  padding-bottom: 2px;
}
.nav-logo .dn {
  font-family: 'Noto Serif Devanagari', serif;
  font-size: 13px;
  color: var(--ink-muted);
  font-weight: 400;
  margin-left: 2px;
}

.nav-links {
  display: flex;
  gap: 2px;
  flex: 1;
}
.nav-link {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-mid);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  border: none;
  background: transparent;
  font-family: inherit;
}
.nav-link:hover { background: var(--border-soft); color: var(--ink); }
.nav-link.active { color: var(--accent); background: var(--accent-soft); }
[data-direction="aarti"] .nav-link.active { background: rgba(232,138,62,0.12); }

.nav-right {
  display: flex; align-items: center; gap: 10px;
}

/* City pill */
.city-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--border-soft);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  color: var(--ink-mid);
  cursor: pointer;
  font-family: inherit;
}
.city-pill:hover { border-color: var(--accent); color: var(--accent); }
.city-pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #FFF;
  border-color: var(--accent);
}
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: var(--shadow-md); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--border);
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-dark {
  background: var(--ink);
  color: var(--bg);
}
[data-direction="aarti"] .btn-dark { background: var(--gold); color: #111; }

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 12px 24px; font-size: 14px; }

.btn-link {
  background: transparent; border: none;
  color: var(--accent);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  padding: 0;
}
.btn-link:hover { text-decoration: underline; }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.2s;
}
.card-hover:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 20px;
  background: var(--border-soft);
  color: var(--ink-mid);
  border: 1px solid var(--border);
}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-good   { background: var(--success); color: var(--green); border-color: transparent; }
.chip-bad    { background: var(--danger); color: var(--red); border-color: transparent; }
.chip-warn   { background: var(--warning); color: var(--gold); border-color: transparent; }
.chip-info   { background: var(--info); color: var(--blue); border-color: transparent; }

/* Divider */
.hr { height: 1px; background: var(--border); border: none; }
.hr-soft { height: 1px; background: var(--border-soft); border: none; }

/* Form */
.field label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-muted);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  font-family: inherit;
  outline: none;
  transition: border 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

/* Tabs (subnav) */
.subnav {
  display: flex;
  gap: 2px;
  padding: 0 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 44px;
  align-items: stretch;
}
.subnav-item {
  padding: 0 14px;
  display: flex; align-items: center;
  font-size: 12px;
  color: var(--ink-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-weight: 500;
  background: transparent; border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}
.subnav-item:hover { color: var(--ink); }
.subnav-item.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Main container */
.main {
  flex: 1;
  min-height: 0;
}
.container {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 28px;
}

/* Scroll */
.scroll-area {
  overflow-y: auto;
  scrollbar-width: thin;
}
.scroll-area::-webkit-scrollbar { width: 8px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Utility */
.row { display: flex; }
.col { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 20px; } .gap-6 { gap: 24px; } .gap-8 { gap: 32px; }
.flex-1 { flex: 1; min-width: 0; }
.center { align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }

/* Muted text */
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }

/* Image placeholder */
.img-ph {
  background:
    repeating-linear-gradient(-45deg, var(--border-soft) 0 8px, transparent 8px 16px),
    var(--accent-soft);
  color: var(--ink-muted);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* Tweaks panel */
.tweaks {
  position: fixed;
  bottom: 20px; right: 20px;
  width: 300px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  padding: 16px;
  z-index: 100;
  font-size: 12px;
}
.tweaks-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.tweaks-title {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.tweak-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0;
  border-top: 1px solid var(--border-soft);
}
.tweak-row:first-of-type { border-top: none; }
.tweak-label { color: var(--ink-mid); }
.seg {
  display: flex;
  background: var(--border-soft);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  padding: 4px 10px;
  font-size: 11px;
  border: none;
  background: transparent;
  color: var(--ink-muted);
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
}
.seg button.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
[data-direction="aarti"] .seg button.on { background: var(--accent); color: #FFF; }

/* Density */
[data-density="compact"] .nav { height: 54px; }
[data-density="compact"] .card { border-radius: 8px; }

/* Focus ring */
*:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Page transitions */
.page-enter {
  animation: pageIn 0.28s ease-out;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>

// Apply tokens as CSS variables
window.applyDirection = function(dir) {
  const t = window.KS_TOKENS[dir] || window.KS_TOKENS.ghat;
  const root = document.documentElement;
  Object.entries(t).forEach(([k, v]) => {
    const cssKey = '--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
    root.style.setProperty(cssKey, v);
  });
  root.setAttribute('data-direction', dir);
};

<script type="text/babel" data-presets="react">// ══════ Kashi Shakti — Panchang Detail Page ═══════

function PanchangDetail({ setPage }) {
  const t = window.KS_DATA.today;
  const cg = window.KS_DATA.choghadiya;
  const [time, setTime] = React.useState(new Date());
  React.useEffect(() => {
    const id = setInterval(() => setTime(new Date()), 60000);
    return () => clearInterval(id);
  }, []);

  // Sun arc progress (morning 5:53 AM to 6:42 PM -> 12h 49m)
  const pct = React.useMemo(() => {
    const m = time.getHours() * 60 + time.getMinutes();
    const start = 5 * 60 + 53;
    const end   = 18 * 60 + 42;
    return Math.max(0, Math.min(1, (m - start) / (end - start)));
  }, [time]);

  return (
    <div className="page-enter container" style={{ paddingBottom: 60 }}>
      <PageHeader
        eyebrow={`${t.samvat} · ${t.masa} ${t.paksha}`}
        title={`${t.vara} · ${t.tithi}`}
        sub={`${t.greg} · Full Panchang with muhurats, choghadiya, and inauspicious periods.`}
        right={
          <div className="seg">
            <button>◀ Yesterday</button>
            <button className="on">Today</button>
            <button>Tomorrow ▶</button>
          </div>
        }
      />

      <PanchangBar today={t} />

      <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 20, marginTop: 24 }}>
        {/* Sun & Moon card */}
        <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
          <div style={{
            padding: 24,
            background: 'linear-gradient(180deg, var(--bg-alt) 0%, var(--surface) 100%)',
            borderBottom: '1px solid var(--border)'
          }}>
            <div className="eyebrow" style={{ marginBottom: 12 }}>☀ Sun Path · New Delhi</div>
            {/* Arc */}
            <div style={{ position: 'relative', height: 140, marginBottom: 10 }}>
              <svg width="100%" height="140" viewBox="0 0 500 140" preserveAspectRatio="none">
                <path d="M 20,130 Q 250,-40 480,130" fill="none"
                  stroke="var(--border)" strokeWidth="1.5" strokeDasharray="3 5"/>
                {[0.1, 0.25, 0.5, 0.75, 0.9].map((p, i) => {
                  const x = 20 + (480 - 20) * p;
                  const y = 130 - 170 * p * (1 - p) * 4;
                  return <circle key={i} cx={x} cy={y} r="2" fill="var(--ink-faint)"/>;
                })}
                {/* current sun */}
                <circle
                  cx={20 + 460 * pct}
                  cy={130 - 170 * pct * (1 - pct) * 4}
                  r="10"
                  fill="var(--gold-bright)"
                  stroke="var(--surface)"
                  strokeWidth="3"
                />
              </svg>
              <div style={{ position: 'absolute', left: 0, bottom: 0, fontSize: 11, color: 'var(--ink-muted)' }}>
                ↑ {t.sunrise}
              </div>
              <div style={{ position: 'absolute', right: 0, bottom: 0, fontSize: 11, color: 'var(--ink-muted)' }}>
                ↓ {t.sunset}
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginTop: 14 }}>
              {[
                { l: 'Sunrise',   v: t.sunrise },
                { l: 'Sunset',    v: t.sunset },
                { l: 'Moonrise',  v: t.moonrise },
                { l: 'Moonset',   v: t.moonset },
              ].map(x => (
                <div key={x.l}>
                  <div className="eyebrow" style={{ fontSize: 9, marginBottom: 4 }}>{x.l}</div>
                  <div className="serif" style={{ fontSize: 16, fontWeight: 600 }}>{x.v}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ padding: 24 }}>
            <div className="eyebrow" style={{ marginBottom: 14 }}>⏱ Choghadiya — auspicious windows</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {cg.map((c, i) => {
                const color = c.rating === 3 ? 'var(--green)' : c.rating === 2 ? 'var(--gold)' : c.rating === 1 ? 'var(--ink-muted)' : 'var(--red)';
                return (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 14,
                    padding: '10px 14px',
                    background: 'var(--bg-alt)',
                    borderRadius: 8,
                    borderLeft: `3px solid ${color}`
                  }}>
                    <div className="mono" style={{ fontSize: 12, color: 'var(--ink-mid)', minWidth: 150 }}>{c.range}</div>
                    <div className="serif" style={{ fontSize: 15, fontWeight: 600, minWidth: 80 }}>{c.name}</div>
                    <div style={{ fontSize: 12, color: 'var(--ink-muted)', flex: 1 }}>{c.desc}</div>
                    <div style={{ fontSize: 11, color }}>
                      {'★'.repeat(c.rating) + '☆'.repeat(3 - c.rating)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Muhurat + Inauspicious */}

          <div className="card" style={{ padding: 22 }}>
            <div className="eyebrow" style={{ marginBottom: 14, color: 'var(--green)' }}>🕉 Auspicious Muhurats</div>
            {[
              { l: 'Brahma Muhurat', v: t.brahmaMuhurat, d: 'Pre-dawn meditation' },

              { l: 'Vijay Muhurat', v: '2:38 – 3:30 PM', d: 'Success in ventures' },

                  <div className="mono" style={{ fontSize: 12, color: 'var(--ink-mid)' }}>{x.v}</div>

                <div style={{ fontSize: 11, color: 'var(--ink-muted)' }}>{x.d}</div>
              </div>
            ))}
          </div>
          <div className="card" style={{ padding: 22 }}>
            <div className="eyebrow" style={{ marginBottom: 14, color: 'var(--red)' }}>⚠ Inauspicious Periods</div>
            {[
              { l: 'Rahu Kaal',    v: t.rahuKaal },
              { l: 'Yamagandam',   v: t.yamagandam },
              { l: 'Gulika Kaal',  v: t.gulika },
              { l: 'Dur Muhurat',  v: '11:53 – 12:44' },
            ].map((x, i) => (
              <div key={i} style={{
                padding: '10px 0',

<script type="text/babel" data-presets="react">// ══════ Kashi Shakti — App Shell ═══════

function App() {
  // Persistent state (refresh-safe)
  const [direction, setDirection] = React.useState(() => localStorage.getItem('ks_dir') || 'ghat');
  const [page, setPage]     = React.useState(() => localStorage.getItem('ks_page') || 'home');
  const [pageState, setPgState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('ks_pstate')) || {}; }
    catch { return {}; }
  });
  const [city, setCity] = React.useState(() => {
    const id = localStorage.getItem('ks_city') || 'delhi';
    return window.KS_DATA.cities.find(c => c.id === id) || window.KS_DATA.cities[0];
  });
  const [user, setUser] = React.useState(() => localStorage.getItem('ks_user') === '1');
  const [authOpen, setAuthOpen] = React.useState(false);
  const [tweaksOn, setTweaksOn] = React.useState(false);

  // Persist
  React.useEffect(() => { localStorage.setItem('ks_dir', direction); window.applyDirection(direction); }, [direction]);
  React.useEffect(() => { localStorage.setItem('ks_page', page); window.scrollTo(0, 0); }, [page]);
  React.useEffect(() => { localStorage.setItem('ks_pstate', JSON.stringify(pageState)); }, [pageState]);
  React.useEffect(() => { localStorage.setItem('ks_city', city.id); }, [city]);
  React.useEffect(() => { localStorage.setItem('ks_user', user ? '1' : '0'); }, [user]);

  const setPage2 = (p) => setPage(p);
  const setPageState = (s) => setPgState(prev => ({ ...prev, ...s }));

  // Tweaks-mode (host-controlled)
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Route
  const today = window.KS_DATA.today;
  const routes = {
    'home':              <window.HomePage        setPage={setPage2} setPageState={setPageState}/>,
    'calendar':          <window.CalendarPage    setPage={setPage2} setPageState={setPageState} today={today} city={city}/>,
    'panchang-detail':   <window.PanchangDetail  setPage={setPage2}/>,
    'festivals':         <window.FestivalsPage   setPage={setPage2} setPageState={setPageState}/>,
    'festival-detail':   <window.FestivalDetail  setPage={setPage2} setPageState={setPageState} pageState={pageState}/>,
    'pujas':             <window.PujasPage       setPage={setPage2} setPageState={setPageState}/>,
    'puja-detail':       <window.PujaDetail      setPage={setPage2} setPageState={setPageState} pageState={pageState}/>,
    'checkout':          <window.CheckoutPage    setPage={setPage2} pageState={pageState}/>,
    'confirmation':      <window.ConfirmationPage setPage={setPage2} pageState={pageState}/>,
    'temples':           <window.TemplesPage     setPage={setPage2}/>,
    'admin':             <window.AdminPage       setPage={setPage2}/>,
    'profile':           <window.ProfilePage     setPage={setPage2} setPageState={setPageState}/>,
    'blog':              <window.BlogPage        setPage={setPage2} setPageState={setPageState}/>,
    'article':           <window.ArticlePage     setPage={setPage2} setPageState={setPageState} pageState={pageState}/>,
  };
  const view = routes[page] || routes.home;

  return (
    <>
      <window.TopNav
        page={page} setPage={setPage2}
        user={user}
        city={city} setCity={setCity} cities={window.KS_DATA.cities}
        onLogin={() => setAuthOpen(true)}
      />
      <div key={page + '_' + direction}>{view}</div>
      <window.Footer setPage={setPage2}/>
      {authOpen && <window.AuthModal onClose={() => setAuthOpen(false)} onLogin={() => setUser(true)}/>}
      {tweaksOn && <TweaksPanel direction={direction} setDirection={setDirection} onReset={() => { localStorage.clear(); location.reload(); }}/>}
    </>
  );
}

}
